    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #f2e8d0; }
      .cortex-boot { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: #f2e8d0; color: #3a1f86; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .cortex-boot::before, .cortex-boot::after { position: absolute; inset: 0; content: ""; pointer-events: none; }
      .cortex-boot::before { opacity: .62; background: linear-gradient(90deg, transparent 0 8%, rgb(58 31 134 / .16) 8% calc(8% + 1px), transparent calc(8% + 1px) 50%, rgb(58 31 134 / .24) 50% calc(50% + 1px), transparent calc(50% + 1px) 92%, rgb(58 31 134 / .16) 92% calc(92% + 1px), transparent calc(92% + 1px)), linear-gradient(0deg, transparent 0 12%, rgb(58 31 134 / .18) 12% calc(12% + 1px), transparent calc(12% + 1px) 58%, rgb(58 31 134 / .14) 58% calc(58% + 1px), transparent calc(58% + 1px)); }
      .cortex-boot::after { inset: 12%; border: 1px solid rgb(58 31 134 / .32); box-shadow: 0 0 0 9px rgb(58 31 134 / .035); }
      .cortex-boot__lockup { position: relative; z-index: 1; display: grid; justify-items: center; gap: 14px; letter-spacing: .26em; font-size: 9px; font-weight: 700; }
      .cortex-boot__mark { width: 36px; height: 36px; border: 1px solid #3a1f86; border-radius: 999px; box-shadow: inset 0 0 0 7px #f2e8d0, inset 0 0 0 8px #3a1f86; animation: cortex-boot-pulse 900ms cubic-bezier(.23, 1, .32, 1) infinite alternate; }
      .cortex-boot__trace { width: min(34vw, 280px); height: 1px; overflow: hidden; background: rgb(58 31 134 / .22); }
      .cortex-boot__trace::after { display: block; width: 38%; height: 100%; background: #3a1f86; content: ""; animation: cortex-boot-trace 950ms cubic-bezier(.23, 1, .32, 1) infinite; }
      @keyframes cortex-boot-pulse { to { transform: scale(.83); opacity: .52; } }
      @keyframes cortex-boot-trace { from { transform: translateX(-115%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { .cortex-boot__mark, .cortex-boot__trace::after { animation: none; } }
    </style>
